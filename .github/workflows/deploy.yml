name: On-Prem Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: onprem-release-main
  cancel-in-progress: false

jobs:
  release-gate:
    name: Prove exact reviewed main SHA
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove main ancestry and exact CI
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]] || {
              echo "Manual publication must select the current main head" >&2
              exit 1
            }
            successful="$({ gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SOURCE_SHA}&status=success&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "main" and .head_sha == env.SOURCE_SHA)] | length'; } 2>/dev/null)"
            [[ "$successful" =~ ^[1-9][0-9]*$ ]] || {
              echo "No successful main CI run exists for exact SHA $SOURCE_SHA" >&2
              exit 1
            }
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-and-push-backend:
    name: Build and push backend image
    needs: release-gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REGISTRY: ghcr.io/ornament-ai/accord
      SOURCE_SHA: ${{ needs.release-gate.outputs.source_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/backend:sha-${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-web:
    name: Build and push web image
    needs: release-gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REGISTRY: ghcr.io/ornament-ai/accord
      SOURCE_SHA: ${{ needs.release-gate.outputs.source_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push web image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/web:sha-${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrations-release-upgrade:
    name: Rehearse deployed-schema upgrade
    needs: release-gate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: onprem-release
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/release_upgrade
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/release_upgrade
      SOURCE_SHA: ${{ needs.release-gate.outputs.source_sha }}
      PREVIOUS_DEPLOYED_SHA: ${{ secrets.ONPREM_DEPLOYED_SHA }}
    steps:
      - name: Check out exact reviewed source and release history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Prove explicit deployed source
        id: previous
        run: |
          [[ "$PREVIOUS_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Protected ONPREM_DEPLOYED_SHA evidence is missing or invalid" >&2
            exit 1
          }
          [[ "$PREVIOUS_DEPLOYED_SHA" != "$SOURCE_SHA" ]] || {
            echo "The deployed SHA must precede the release candidate" >&2
            exit 1
          }
          git cat-file -e "${PREVIOUS_DEPLOYED_SHA}^{commit}"
          git merge-base --is-ancestor "$PREVIOUS_DEPLOYED_SHA" "$SOURCE_SHA" || {
            echo "Protected deployed SHA is not an ancestor of the release candidate" >&2
            exit 1
          }
          echo "sha=$PREVIOUS_DEPLOYED_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install current backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Create rehearsal database and roles
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres release_upgrade
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d release_upgrade \
            -f backend/scripts/create_roles.sql

      - name: Resolve PostgreSQL 18 service container
        id: postgres-service
        run: |
          mapfile -t container_ids < <(
            docker ps --filter ancestor=postgres:18-alpine --format '{{.ID}}'
          )
          if [[ ${#container_ids[@]} -ne 1 ]]; then
            echo "Expected exactly one running PostgreSQL 18 service container; found ${#container_ids[@]}" >&2
            exit 1
          fi
          container_id="${container_ids[0]}"
          [[ "$(docker inspect --format '{{.Config.Image}}' "$container_id")" == "postgres:18-alpine" ]]
          echo "container-id=$container_id" >> "$GITHUB_OUTPUT"

      - name: Apply previous release migrations
        run: |
          git worktree add --detach ../accord-previous "${{ steps.previous.outputs.sha }}"
          test -d ../accord-previous/backend/migrations/versions
          cd ../accord-previous/backend
          python -m alembic upgrade head
          docker exec -e PGPASSWORD=postgres "${{ steps.postgres-service.outputs.container-id }}" \
            pg_dump -U postgres -d release_upgrade -Fc \
            > "${RUNNER_TEMP}/previous-release.dump"

      - name: Upgrade previous schema to exact reviewed source
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check
          expected="$(python -m alembic heads 2>&1 | head -1 | awk '{print $1}')"
          actual="$(PGPASSWORD=postgres psql -h localhost -U postgres -d release_upgrade -tAc 'SELECT version_num FROM alembic_version')"
          [[ "$actual" == "$expected" ]]

      - name: Rehearse paired database restore to previous release
        env:
          PGPASSWORD: postgres
        run: |
          dropdb -h localhost -U postgres release_upgrade
          createdb -h localhost -U postgres release_upgrade
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d release_upgrade \
            -f backend/scripts/create_roles.sql
          docker exec -i -e PGPASSWORD=postgres \
            "${{ steps.postgres-service.outputs.container-id }}" \
            pg_restore --list < "${RUNNER_TEMP}/previous-release.dump" >/dev/null
          docker exec -i -e PGPASSWORD=postgres \
            "${{ steps.postgres-service.outputs.container-id }}" \
            pg_restore -U postgres -d release_upgrade \
            < "${RUNNER_TEMP}/previous-release.dump"
          cd ../accord-previous/backend
          python -m alembic upgrade head
          python -m alembic check

      - name: Record exact rehearsed deployed source
        run: printf '%s\n' "$PREVIOUS_DEPLOYED_SHA" > "${RUNNER_TEMP}/rehearsed-deployed-sha"

      - name: Transfer rehearsed source to publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accord-rehearsed-from-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/rehearsed-deployed-sha

  publish-release-evidence:
    name: Publish standard release evidence
    needs: [release-gate, build-and-push-backend, build-and-push-web, migrations-release-upgrade]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: onprem-release
    permissions:
      actions: read
      contents: write
    env:
      REGISTRY: ghcr.io/ornament-ai/accord
      SOURCE_SHA: ${{ needs.release-gate.outputs.source_sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Download exact migration-rehearsal source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accord-rehearsed-from-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/migration-evidence

      - name: Build and validate release evidence
        env:
          ACCORD_BACKEND_DIGEST: ${{ needs.build-and-push-backend.outputs.digest }}
          ACCORD_WEB_DIGEST: ${{ needs.build-and-push-web.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ACCORD_PREVIOUS_DEPLOYED_SHA="$(cat "${RUNNER_TEMP}/migration-evidence/rehearsed-deployed-sha")"
          export ACCORD_PREVIOUS_DEPLOYED_SHA
          [[ "$ACCORD_PREVIOUS_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          bash deploy/package-release.sh "${{ runner.temp }}/release"
          bash deploy/package-transition-rollback.sh \
            "$SOURCE_SHA" "$ACCORD_PREVIOUS_DEPLOYED_SHA" "${RUNNER_TEMP}/rollback"

      - name: Sign immutable VM release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.ONPREM_RELEASE_SIGNING_KEY }}
        run: |
          [[ -n "$RELEASE_SIGNING_KEY" ]] || { echo "ONPREM_RELEASE_SIGNING_KEY is required" >&2; exit 1; }
          umask 077
          signing_key="${RUNNER_TEMP}/accord-release-signing-key.pem"
          printf '%s' "$RELEASE_SIGNING_KEY" > "$signing_key"
          previous_sha="$(cat "${RUNNER_TEMP}/migration-evidence/rehearsed-deployed-sha")"
          for specification in "${RUNNER_TEMP}/release:$SOURCE_SHA" "${RUNNER_TEMP}/rollback:$previous_sha"; do
            directory="${specification%%:*}"
            bundle_sha="${specification##*:}"
            cd "$directory"
            sha256sum "accord-deploy-sha-${bundle_sha}.tar.gz" \
              "onprem-release-${bundle_sha}.json" > "onprem-checksums-${bundle_sha}.txt"
            openssl pkeyutl -sign -rawin -inkey "$signing_key" \
              -in "onprem-checksums-${bundle_sha}.txt" \
              -out "onprem-signature-${bundle_sha}.sig"
            openssl pkeyutl -verify -pubin -rawin \
              -inkey "${GITHUB_WORKSPACE}/deploy/onprem-release-signing-public.pem" \
              -in "onprem-checksums-${bundle_sha}.txt" \
              -sigfile "onprem-signature-${bundle_sha}.sig" || {
                rm -f "$signing_key"
                echo "ONPREM_RELEASE_SIGNING_KEY does not match the pinned public key" >&2
                exit 1
              }
          done
          transition_prefix="rollback-from-${SOURCE_SHA}-to-${previous_sha}-"
          for path in "${RUNNER_TEMP}/rollback"/*; do
            mv "$path" "${RUNNER_TEMP}/release/${transition_prefix}$(basename "$path")"
          done
          rm -f "$signing_key"

      - name: Upload immutable VM release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accord-deploy-sha-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/release/accord-deploy-sha-${{ env.SOURCE_SHA }}.tar.gz
            ${{ runner.temp }}/release/onprem-release-${{ env.SOURCE_SHA }}.json
            ${{ runner.temp }}/release/onprem-checksums-${{ env.SOURCE_SHA }}.txt
            ${{ runner.temp }}/release/onprem-signature-${{ env.SOURCE_SHA }}.sig
            ${{ runner.temp }}/release/rollback-from-*-to-*

      - name: Publish durable commit-specific release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="onprem-sha-${SOURCE_SHA}"
          release_record="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$release_tag\") | [.id, .draft, .target_commitish] | @tsv"
          )"
          if [[ "$release_record" == *$'\n'* ]]; then
            echo "Refusing ambiguous duplicate release records for $release_tag" >&2
            exit 1
          fi
          if [[ -n "$release_record" ]]; then
            IFS=$'\t' read -r release_id release_is_draft release_target <<<"$release_record"
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Refusing to overwrite published durable release $release_tag" >&2
              exit 1
            fi
            if [[ "$release_target" != "$SOURCE_SHA" ]]; then
              echo "Refusing incomplete draft $release_tag for unexpected target $release_target" >&2
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$release_id"
          fi
          existing_tag="$(git ls-remote --tags origin "refs/tags/$release_tag" | awk 'NR == 1 { print $1 }')"
          if [[ -n "$existing_tag" ]]; then
            if [[ "$existing_tag" != "$SOURCE_SHA" ]]; then
              echo "Refusing to replace $release_tag at unexpected commit $existing_tag" >&2
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$release_tag"
          fi
          transition_assets=("${RUNNER_TEMP}/release/rollback-from-${SOURCE_SHA}-to-"*)
          [[ ${#transition_assets[@]} -eq 4 ]]
          gh release create "$release_tag" \
            --draft \
            --target "$SOURCE_SHA" \
            --title "Accord on-prem release $SOURCE_SHA" \
            --notes "Immutable on-prem deployment bundle and standard release evidence for commit $SOURCE_SHA." \
            "${RUNNER_TEMP}/release/accord-deploy-sha-${SOURCE_SHA}.tar.gz" \
            "${RUNNER_TEMP}/release/onprem-release-${SOURCE_SHA}.json" \
            "${RUNNER_TEMP}/release/onprem-checksums-${SOURCE_SHA}.txt" \
            "${RUNNER_TEMP}/release/onprem-signature-${SOURCE_SHA}.sig" \
            "${transition_assets[@]}"
          release_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$release_tag\")")"
          release_id="$(jq -r '.id' <<<"$release_json")"
          [[ "$(jq -r '.draft' <<<"$release_json")" == "true" \
            && "$(jq -r '.target_commitish' <<<"$release_json")" == "$SOURCE_SHA" ]]
          expected_assets="$(printf '%s\n' \
            "accord-deploy-sha-${SOURCE_SHA}.tar.gz" \
            "onprem-release-${SOURCE_SHA}.json" \
            "onprem-checksums-${SOURCE_SHA}.txt" \
            "onprem-signature-${SOURCE_SHA}.sig" \
            "$(basename "${transition_assets[0]}")" \
            "$(basename "${transition_assets[1]}")" \
            "$(basename "${transition_assets[2]}")" \
            "$(basename "${transition_assets[3]}")" | sort)"
          actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          [[ "$actual_assets" == "$expected_assets" ]] || {
            echo "Draft release does not contain the complete forward and rollback evidence set" >&2
            exit 1
          }
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
            -F draft=false >/dev/null

      - name: Release summary
        run: |
          {
            echo "## Images Pushed :package:"
            echo ""
            echo "| Image | Tags |"
            echo "|---|---|"
            echo "| **backend** | \`${{ env.REGISTRY }}/backend:sha-${{ env.SOURCE_SHA }}\` |"
            echo "| **web** | \`${{ env.REGISTRY }}/web:sha-${{ env.SOURCE_SHA }}\` |"
            echo "| **Branch** | \`${{ env.SOURCE_BRANCH }}\` |"
            echo "| **Commit** | \`${{ env.SOURCE_SHA }}\` |"
            echo "| **Release evidence** | \`onprem-release-${{ env.SOURCE_SHA }}.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
