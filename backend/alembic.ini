[alembic]
script_location = migrations

# Version files import app.models (rls_policy_sql) at module top; without
# this, alembic heads/history fail because env.py (which fixes sys.path)
# is only executed by commands that run migrations.
prepend_sys_path = .
sqlalchemy.url = placeholder://replaced-at-runtime

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
