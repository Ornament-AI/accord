packages:
  - frontend
  - tools/openapi-typescript-runtime
# Keep GitHub dependency parsing on the main lockfile; Corepack and CI still
# select the packageManager pin from package.json.
pmOnFail: ignore
overrides:
  protobufjs: 7.6.4
  js-yaml: 4.3.0
  "path-to-regexp@8": ^8.4.2
  postcss: ^8.5.16
  "brace-expansion@2": ^2.1.1
  undici: 7.28.0
allowBuilds:
  msw: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - vite@8.1.0
  - undici@7.28.0
trustPolicy: no-downgrade
