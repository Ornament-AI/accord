packages:
  - frontend
  - tools/openapi-typescript-runtime
# Keep GitHub dependency parsing on the main lockfile; Corepack and CI still
# select the packageManager pin from package.json.
pmOnFail: ignore
overrides:
  protobufjs: 7.6.4
  js-yaml: 4.3.2
  "path-to-regexp@8": ^8.4.2
  postcss: ^8.5.23
  "brace-expansion@2": ^2.1.7
  "nanoid@3": ^3.3.18
  source-map-js: ^1.2.2
  undici: 7.30.1
allowBuilds:
  msw: true
trustPolicy: no-downgrade
